name: Publish Docker image

# Builds a multi-arch (amd64 + arm64) image and pushes it to Docker Hub
# whenever you push a version tag like `v1.0.0`. Also runnable on demand.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  IMAGE: yngf73/linkbank

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Needed so the final step can create a GitHub Release for the tag.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only on a real tag push (not manual runs): publish a GitHub Release with
      # auto-generated notes, and point people at the matching Docker Hub image.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            Docker image: `docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}`

            Multi-arch (linux/amd64 + linux/arm64). See [DOCKER.md](https://github.com/YngF/linkbank/blob/main/DOCKER.md) for deployment.
