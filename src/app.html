<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4b83f0" />
    <title>LinkBank</title>
    <script>
      // Apply saved theme + UI scale before first paint (no flash).
      try {
        var t = localStorage.getItem('lb-theme');
        if (t) document.documentElement.dataset.theme = t;
        var z = localStorage.getItem('lb-scale');
        if (z) {
          document.documentElement.style.zoom = z;
          document.documentElement.style.setProperty('--ui-zoom', z);
        }
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
