<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>LinkBank — options</title>
<style>
  :root { --accent: #4b83f0; --line: #e6e8ef; --ink: #1c2333; --mute: #7a8194; }
  * { box-sizing: border-box; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #f6f7fb; margin: 0; padding: 40px 20px; }
  .card { max-width: 460px; margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(145deg, #4b83f0, #8659e8); }
  p { color: var(--mute); font-size: 13px; margin: 0 0 18px; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mute); font-weight: 600; margin-bottom: 5px; }
  input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 14px; outline: 0; margin-bottom: 16px; }
  input:focus { border-color: var(--accent); }
  button { border: 0; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 560; cursor: pointer; background: var(--accent); color: #fff; }
  .status { margin-left: 10px; font-size: 13px; }
  .ok { color: #1a7f4b; } .err { color: #c23636; }
  .hint { font-size: 12px; color: var(--mute); margin-top: 14px; line-height: 1.5; }
  .hint b { color: var(--ink); }
</style>
</head>
<body>
  <div class="card">
    <h1><span class="logo"></span> LinkBank extension</h1>
    <p>Point this at your LinkBank and paste an access token.</p>
    <label>LinkBank URL</label>
    <input id="baseUrl" placeholder="https://linkbank.no" />
    <label>Access token</label>
    <input id="token" placeholder="lb_…" />
    <div>
      <button id="save">Save</button>
      <button id="test" style="background:#eef0f5;color:#1c2333">Test</button>
      <span class="status" id="status"></span>
    </div>
    <div class="hint">
      Create a token in LinkBank under <b>Account → Access tokens</b>. It’s shown once — paste it here.
      Links you save land in your <b>Inbox</b> folder.
    </div>
  </div>
  <script src="lib.js"></script>
  <script src="options.js"></script>
</body>
</html>
